services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: eu_funding
      POSTGRES_USER: eu_funding
      POSTGRES_PASSWORD: eu_funding
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eu_funding -d eu_funding"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
