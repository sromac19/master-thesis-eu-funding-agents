[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "eu-funding-agents"
version = "0.1.0"
description = "Controlled multi-agent system for ranking EU funding calls and checking proposal eligibility"
requires-python = ">=3.11,<3.13"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "httpx>=0.27",
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.2",
  "alembic>=1.13",
  "structlog>=24.4",
  "prometheus-client>=0.21",
  "langgraph>=1.0",
  "langgraph-checkpoint-postgres>=3.1,<4",
  "rdflib>=7.1",
  "rank-bm25>=0.2.2",
  "pypdf>=5.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "httpx>=0.27",
  "ruff>=0.6",
]
agents = [
  "langchain>=1.0",
]
llm = [
  "openai>=2.0,<3",
]
ui = [
  "reportlab>=4.2",
  "streamlit>=1.40",
]
ml = [
  "matplotlib>=3.9",
  "pandas>=2.2",
  "scikit-learn>=1.5",
  "sentence-transformers>=3.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
  "integration: requires an explicitly configured reachable PostgreSQL database",
]

[tool.ruff]
line-length = 100
target-version = "py311"
